<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ images[start_index].rel_path }}</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #111; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    img { max-width: 100vw; max-height: 100vh; object-fit: contain; display: block; cursor: zoom-in; }
    #caption {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 16px;
      background: rgba(0,0,0,0.55); color: #eee; font-size: 0.85rem;
      text-align: center; word-break: break-all;
    }
    #nav-hint {
      position: fixed; top: 0; left: 0; right: 0; padding: 6px 16px;
      background: rgba(0,0,0,0.35); color: #ccc; font-size: 0.75rem; text-align: center;
      opacity: 0; transition: opacity 0.3s;
    }
    body:hover #nav-hint { opacity: 1; }
  </style>
</head>
<body>
  <div id="nav-hint">&larr; / &rarr; to switch between duplicates in this group &middot; double-click image to toggle fullscreen</div>
  <img id="viewer-img" alt="">
  <div id="caption"></div>

  <script>
    const images = {{ images | tojson }};
    let index = {{ start_index }};

    const imgEl = document.getElementById('viewer-img');
    const captionEl = document.getElementById('caption');

    function show(i) {
      index = (i + images.length) % images.length; // wrap around at either end
      const entry = images[index];
      imgEl.src = `/api/full/${entry.id}`;
      captionEl.textContent = `${entry.rel_path}  (${index + 1} / ${images.length})`;
      document.title = entry.rel_path;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') show(index - 1);
      else if (e.key === 'ArrowRight') show(index + 1);
      else if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
    });

    // A double-click here is a genuine user gesture, so the Fullscreen API
    // will actually grant the request (unlike calling it automatically on
    // page load, which browsers block without one).
    imgEl.addEventListener('dblclick', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });

    // Best-effort: try going fullscreen immediately too, in case the
    // browser treats opening this tab (from the double-click on the review
    // page) as sufficient activation. Silently does nothing if blocked --
    // the page already fills the viewport via CSS either way.
    document.documentElement.requestFullscreen().catch(() => {});

    show(index);
  </script>
</body>
</html>
